[package]
name = "hopchat"
version = "0.1.0"
edition = "2024"
description = "Offline terminal chat over an Offline Protocol mesh: no internet, no server"
license = "MIT"

[dependencies]
getrandom = "0.4.3"
offline-protocol = { version = "0.30.0", default-features = false, features = ["file-store"] }
offline-protocol-core = "0.30.0"
offline-protocol-mls = "0.30.0"
offline-protocol-transport = "0.30.0"
ratatui = "0.30.2"
serde_json = "1.0.154"
socket2 = { version = "0.6.5", features = ["all"] }
base64 = "0.22.1"
chacha20poly1305 = "0.10.1"
chrono = { version = "0.4.45", default-features = false, features = ["clock", "std"] }
serde = { version = "1.0.229", features = ["derive"] }
sha2 = "0.10.9"
unicode-width = "0.2.2"
tungstenite = { version = "0.30", default-features = false, features = ["handshake", "native-tls"] }
ureq = { version = "3", default-features = false, features = ["json"] }
native-tls = "0.2"
