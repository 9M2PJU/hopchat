name: Release

# Tags publish a release. Pull requests that touch packaging, and manual runs,
# build every artifact the same way but never publish, so the first tag is not
# the first time this pipeline runs.
on:
  push:
    tags:
      - "v*"
  pull_request:
    paths:
      - ".github/workflows/release.yml"
      - "packaging/**"
      - "install.sh"
      - "Cargo.toml"
      - "Cargo.lock"
  workflow_dispatch:

# Read-only by default. Only the publish job below gets write access.
permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  # Pinned tool versions. Bump on purpose, not by accident.
  CARGO_DEB_VERSION: "3.8.0"
  CARGO_GENERATE_RPM_VERSION: "0.21.1"
  APPIMAGETOOL_URL: https://github.com/AppImage/appimagetool/releases/download/1.9.1/appimagetool-x86_64.AppImage
  APPIMAGETOOL_SHA256: ed4ce84f0d9caff66f50bcca6ff6f35aae54ce8135408b3fa33abfc3cb384eb0
  # The oldest glibc the Linux binaries may need. README promises this floor;
  # the build fails if a runner image bump would silently raise it.
  GLIBC_FLOOR: "2.35"

jobs:
  lint:
    name: shellcheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - run: shellcheck -s sh install.sh packaging/appimage/build.sh

  # Each target is compiled exactly once. The tarball and every Linux package
  # below ship these same bytes.
  build:
    name: build (${{ matrix.target }})
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        # Linux builds run on the oldest supported Ubuntu so the binaries link
        # against an older glibc; the GLIBC_FLOOR check enforces it.
        include:
          - { target: x86_64-unknown-linux-gnu, runner: ubuntu-22.04, os: linux, arch: x86_64 }
          - { target: aarch64-unknown-linux-gnu, runner: ubuntu-22.04-arm, os: linux, arch: aarch64 }
          # Cross-compiled on the arm64 runner; the smoke test runs it under Rosetta 2.
          - { target: x86_64-apple-darwin, runner: macos-latest, os: macos, arch: x86_64 }
          - { target: aarch64-apple-darwin, runner: macos-latest, os: macos, arch: aarch64 }
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: stable
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          key: ${{ matrix.target }}

      - name: Resolve version
        id: version
        shell: bash
        run: |
          set -euo pipefail
          VER="$(cargo metadata --no-deps --format-version 1 --locked \
            | jq -r '.packages[] | select(.name == "hopchat") | .version')"
          [ -n "$VER" ] || { echo "::error::could not read the hopchat version"; exit 1; }
          # A tag must match Cargo.toml, or tarballs and packages would carry
          # different versions and install.sh would look up the wrong asset.
          if [ "$GITHUB_REF_TYPE" = "tag" ] && [ "${GITHUB_REF_NAME#v}" != "$VER" ]; then
            echo "::error::tag $GITHUB_REF_NAME does not match Cargo.toml version $VER"
            exit 1
          fi
          echo "VER=$VER" >> "$GITHUB_ENV"

      - name: Build binary
        run: cargo build --release --locked --target ${{ matrix.target }}

      - name: Check glibc floor
        if: matrix.os == 'linux'
        shell: bash
        run: |
          set -euo pipefail
          max="$(objdump -T "target/${{ matrix.target }}/release/hopchat" \
            | grep -o 'GLIBC_[0-9][0-9.]*' | sed 's/^GLIBC_//' | sort -uV | tail -1)"
          echo "highest glibc symbol version: $max (floor $GLIBC_FLOOR)"
          if [ "$(printf '%s\n%s\n' "$max" "$GLIBC_FLOOR" | sort -V | tail -1)" != "$GLIBC_FLOOR" ]; then
            echo "::error::binary needs glibc $max, above the documented floor $GLIBC_FLOOR"
            exit 1
          fi

      - name: Smoke test binary
        run: target/${{ matrix.target }}/release/hopchat --help

      - name: Build tarball
        shell: bash
        run: |
          set -eux
          # install.sh expects hopchat-<ver>-<os>-<arch>.tar.gz with ./hopchat at the top.
          mkdir -p dist staging
          cp "target/${{ matrix.target }}/release/hopchat" README.md LICENSE staging/
          tar -czf "dist/hopchat-${VER}-${{ matrix.os }}-${{ matrix.arch }}.tar.gz" -C staging hopchat README.md LICENSE

      - name: Upload tarball
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: dist-tarball-${{ matrix.target }}
          path: dist/*
          if-no-files-found: error

      # The packaging jobs reuse this exact binary instead of rebuilding it.
      - name: Upload binary for packaging
        if: matrix.target == 'x86_64-unknown-linux-gnu'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: bin-${{ matrix.target }}
          path: target/${{ matrix.target }}/release/hopchat
          if-no-files-found: error

  package:
    name: ${{ matrix.asset }} (x86_64-unknown-linux-gnu)
    needs: [build]
    runs-on: ubuntu-22.04
    strategy:
      fail-fast: false
      matrix:
        asset: [deb, rpm, appimage]
    env:
      TARGET: x86_64-unknown-linux-gnu
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: stable

      # Caches the installed cargo-deb / cargo-generate-rpm between runs.
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          key: package-${{ matrix.asset }}

      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: bin-${{ env.TARGET }}
          path: target/${{ env.TARGET }}/release

      - name: Prepare binary
        shell: bash
        run: |
          set -euo pipefail
          # Artifacts do not keep the executable bit.
          chmod 755 "target/$TARGET/release/hopchat"
          VER="$(cargo metadata --no-deps --format-version 1 --locked \
            | jq -r '.packages[] | select(.name == "hopchat") | .version')"
          echo "VER=$VER" >> "$GITHUB_ENV"
          mkdir -p dist

      - name: Build .deb (cargo-deb)
        if: matrix.asset == 'deb'
        run: |
          set -eux
          cargo install cargo-deb --locked --version "$CARGO_DEB_VERSION"
          # --no-strip keeps the packaged binary byte-identical to the tarball's.
          cargo deb --target "$TARGET" --no-build --no-strip --output dist/
          # Install it on this runner to prove its dependencies resolve and it runs.
          sudo apt-get update -y
          sudo apt-get install -y ./dist/*.deb
          hopchat --help
          sudo apt-get remove -y hopchat

      - name: Build .rpm (cargo-generate-rpm)
        if: matrix.asset == 'rpm'
        run: |
          set -eux
          cargo install cargo-generate-rpm --locked --version "$CARGO_GENERATE_RPM_VERSION"
          cargo generate-rpm --target "$TARGET" --output dist/
          # Install it on Fedora to prove its dependencies resolve and it runs.
          docker run --rm -v "$PWD/dist:/dist:ro" fedora:latest \
            sh -c 'dnf install -y /dist/*.rpm && hopchat --help'

      - name: Build AppImage
        if: matrix.asset == 'appimage'
        run: |
          set -eux
          sudo apt-get update -y
          sudo apt-get install -y file desktop-file-utils
          curl -fsSL -o "$RUNNER_TEMP/appimagetool" "$APPIMAGETOOL_URL"
          echo "$APPIMAGETOOL_SHA256  $RUNNER_TEMP/appimagetool" | sha256sum -c -
          sudo install -m 755 "$RUNNER_TEMP/appimagetool" /usr/local/bin/appimagetool
          # appimagetool is itself an AppImage: extract it instead of needing FUSE.
          export APPIMAGE_EXTRACT_AND_RUN=1
          VERSION="$VER" sh packaging/appimage/build.sh \
            --binary "target/$TARGET/release/hopchat" --output dist
          "dist/hopchat-${VER}-linux-x86_64.AppImage" --help

      - name: Upload package
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: dist-${{ matrix.asset }}-${{ env.TARGET }}
          path: dist/*
          if-no-files-found: error

  release:
    name: publish release
    # All or nothing: a release missing an asset would send install.sh users
    # to a slow source build, so any failed leg stops the publish. Pull
    # requests run the same legs, which is where such failures should surface.
    if: github.ref_type == 'tag' && startsWith(github.ref_name, 'v')
    needs: [lint, build, package]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: dist-*
          path: dist
          merge-multiple: true

      - name: Write checksums
        working-directory: dist
        run: |
          set -eu
          sha256sum -- * > SHA256SUMS
          cat SHA256SUMS

      - name: Create GitHub Release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          files: dist/*
          fail_on_unmatched_files: true
          generate_release_notes: true

  # Runs the one-liner the README documents against the release just published.
  verify-install:
    name: install.sh (${{ matrix.runner }})
    if: github.ref_type == 'tag' && startsWith(github.ref_name, 'v')
    needs: [release]
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-22.04, ubuntu-22.04-arm, macos-latest]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Install with install.sh
        shell: bash
        run: |
          set -euxo pipefail
          sh install.sh --dir "$RUNNER_TEMP/bin" --tag "$GITHUB_REF_NAME" | tee "$RUNNER_TEMP/install.log"
          # Runners have cargo, so a missing asset would quietly fall back to a
          # source build. Require the verified prebuilt path.
          grep -q '^Checksum OK\.$' "$RUNNER_TEMP/install.log"
          "$RUNNER_TEMP/bin/hopchat" --help
