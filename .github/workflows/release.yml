name: Release

# Tags publish a release. Pull requests that touch packaging, and manual runs,
# build every artifact the same way but never publish, so the first tag is not
# the first time this pipeline runs.
on:
  push:
    tags:
      - "v*"
  pull_request:
    paths:
      - ".github/workflows/release.yml"
      - "packaging/**"
      - "install.sh"
      - "Cargo.toml"
      - "Cargo.lock"
  workflow_dispatch:

# Read-only by default. Only the publish job below gets write access.
permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  # Pinned tool versions. Bump on purpose, not by accident.
  CARGO_DEB_VERSION: "3.8.0"
  CARGO_GENERATE_RPM_VERSION: "0.21.1"
  APPIMAGETOOL_URL: https://github.com/AppImage/appimagetool/releases/download/1.9.1/appimagetool-x86_64.AppImage
  APPIMAGETOOL_SHA256: ed4ce84f0d9caff66f50bcca6ff6f35aae54ce8135408b3fa33abfc3cb384eb0

jobs:
  artifacts:
    name: ${{ matrix.asset }} (${{ matrix.target }})
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        # Linux builds run on the oldest supported Ubuntu so the binaries link
        # against an older glibc and run on Debian 12 / Ubuntu 22.04 and newer.
        include:
          - target: x86_64-unknown-linux-gnu
            runner: ubuntu-22.04
            asset: tarball
          - target: x86_64-unknown-linux-gnu
            runner: ubuntu-22.04
            asset: deb
          - target: x86_64-unknown-linux-gnu
            runner: ubuntu-22.04
            asset: rpm
          - target: x86_64-unknown-linux-gnu
            runner: ubuntu-22.04
            asset: appimage
          - target: aarch64-unknown-linux-gnu
            runner: ubuntu-22.04-arm
            asset: tarball
          - target: x86_64-apple-darwin
            runner: macos-latest
            asset: tarball
            # Cross-compiled on an arm64 runner, so it is not run here.
            cross: true
          - target: aarch64-apple-darwin
            runner: macos-latest
            asset: tarball
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: stable
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          key: ${{ matrix.target }}-${{ matrix.asset }}

      - name: Resolve version
        shell: bash
        run: |
          set -eu
          VER="$(grep -m1 '^version' Cargo.toml | cut -d'"' -f2)"
          # A tag must match Cargo.toml, or tarballs and packages would carry
          # different versions and install.sh would look up the wrong asset.
          if [ "$GITHUB_REF_TYPE" = "tag" ] && [ "${GITHUB_REF_NAME#v}" != "$VER" ]; then
            echo "::error::tag $GITHUB_REF_NAME does not match Cargo.toml version $VER"
            exit 1
          fi
          echo "VER=$VER" >> "$GITHUB_ENV"

      - name: Build binary
        run: cargo build --release --locked --target ${{ matrix.target }}

      - name: Smoke test binary
        if: ${{ !matrix.cross }}
        run: target/${{ matrix.target }}/release/hopchat --help

      - name: Build tarball
        if: matrix.asset == 'tarball'
        shell: bash
        run: |
          set -eux
          # install.sh expects hopchat-<ver>-<os>-<arch>.tar.gz with ./hopchat at the top.
          case "${{ matrix.target }}" in
            *-linux-*) OS=linux ;;
            *-apple-*) OS=macos ;;
          esac
          case "${{ matrix.target }}" in
            x86_64-*) ARCH=x86_64 ;;
            aarch64-*) ARCH=aarch64 ;;
          esac
          mkdir -p dist staging
          cp "target/${{ matrix.target }}/release/hopchat" README.md LICENSE staging/
          tar -czf "dist/hopchat-${VER}-${OS}-${ARCH}.tar.gz" -C staging hopchat README.md LICENSE

      - name: Build .deb (cargo-deb)
        if: matrix.asset == 'deb'
        run: |
          set -eux
          cargo install cargo-deb --locked --version "$CARGO_DEB_VERSION"
          mkdir -p dist
          cargo deb --target ${{ matrix.target }} --no-build --output dist/
          # Install it on this runner to prove its dependencies resolve and it runs.
          sudo apt-get update -y
          sudo apt-get install -y ./dist/*.deb
          hopchat --help
          sudo apt-get remove -y hopchat

      - name: Build .rpm (cargo-generate-rpm)
        if: matrix.asset == 'rpm'
        run: |
          set -eux
          cargo install cargo-generate-rpm --locked --version "$CARGO_GENERATE_RPM_VERSION"
          mkdir -p dist
          cargo generate-rpm --target ${{ matrix.target }} --output dist/

      - name: Build AppImage
        if: matrix.asset == 'appimage'
        run: |
          set -eux
          sudo apt-get update -y
          sudo apt-get install -y file desktop-file-utils
          curl -fsSL -o "$RUNNER_TEMP/appimagetool" "$APPIMAGETOOL_URL"
          echo "$APPIMAGETOOL_SHA256  $RUNNER_TEMP/appimagetool" | sha256sum -c -
          sudo install -m 755 "$RUNNER_TEMP/appimagetool" /usr/local/bin/appimagetool
          # appimagetool is itself an AppImage: extract it instead of needing FUSE.
          export APPIMAGE_EXTRACT_AND_RUN=1
          sh packaging/appimage/build.sh \
            --binary "target/${{ matrix.target }}/release/hopchat" --output dist
          "dist/hopchat-${VER}-linux-x86_64.AppImage" --help

      - name: Upload artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ${{ matrix.asset }}-${{ matrix.target }}
          path: dist/*
          if-no-files-found: error

  release:
    name: publish release
    # All or nothing: a release missing an asset would send install.sh users
    # to a slow source build, so any failed leg stops the publish. Pull
    # requests run the same legs, which is where such failures should surface.
    if: github.ref_type == 'tag' && startsWith(github.ref_name, 'v')
    needs: [artifacts]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          path: dist
          merge-multiple: true

      - name: Write checksums
        working-directory: dist
        run: |
          set -eu
          sha256sum -- * > SHA256SUMS
          cat SHA256SUMS

      - name: Create GitHub Release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          files: dist/*
          fail_on_unmatched_files: true
          generate_release_notes: true
